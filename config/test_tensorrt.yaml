# TensorRT 后端测试配置（DeepSORT，FP16）

backend:
  type: "tensorrt"
  device_id: 0
  fp16: true   # tensorrt 专用：FP16 计算精度，网络输入输出仍为 FP32

dataset:
  coco_labels: "./coco_80_labels_list.txt"

input:
  source: "./test_video.avi"
  type: "video"

output:
  video: ""
  image: "out1.jpg"
  fourcc: "MJPG"
  fps: 10
  width: 1920
  height: 1080
  show: false
  timing: "timing_trt.csv"

detector:
  type: "yolov8"
  backend: "tensorrt"
  model_path: "./models/yolov8s.onnx"
  input_width: 640
  input_height: 640
  confidence_threshold: 0.25
  nms_threshold: 0.4

tracker:
  type: "deepsort"

deepsort:
  feature_model_path: "./models/feature.onnx"
  backend: "tensorrt"
  feature_dim: 512
  max_cosine_distance: 0.2
  nn_budget: 100
  max_iou_distance: 0.7
  max_age: 30
  n_init: 3

bytetrack:
  track_buffer: 30
  track_thresh: 0.5
  high_thresh: 0.6
  match_thresh: 0.8
