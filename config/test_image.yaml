# 图片输入测试配置（GPU 后端）

backend:
  type: "onnxruntime_gpu"
  device_id: 0

dataset:
  coco_labels: "./coco_80_labels_list.txt"

input:
  source: "./test_frame.jpg"
  type: "image"

output:
  video: ""            # 图片模式不写视频
  image: "out_image.jpg"
  fourcc: "MJPG"
  fps: 10
  width: 1920
  height: 1080
  show: false          # headless 验证；本地有显示环境可改 true
  result: ""

detector:
  type: "yolov8"
  backend: "onnxruntime_gpu"
  model_path: "./models/yolov8s.onnx"
  input_width: 640
  input_height: 640
  confidence_threshold: 0.25
  nms_threshold: 0.4

tracker:
  type: "deepsort"

deepsort:
  feature_model_path: "./models/feature.onnx"
  backend: "onnxruntime_gpu"
  feature_dim: 512
  max_cosine_distance: 0.2
  nn_budget: 100
  max_iou_distance: 0.7
  max_age: 30
  n_init: 3

bytetrack:
  track_buffer: 30
  track_thresh: 0.5
  high_thresh: 0.6
  match_thresh: 0.8
